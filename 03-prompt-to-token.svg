<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Arial, 'Helvetica Neue', sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#1a1a1a"/></marker><marker id="arwl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#5a5a5a"/></marker><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9e9e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b0b0b0" stroke-width="2"/></pattern></defs><text x="20" y="22" font-size="10.5" font-weight="600" fill="#5a5a5a" text-anchor="start" letter-spacing="1.3">FROM PROMPT TO FIRST TOKEN</text><rect x="20" y="40" width="120" height="34" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1.25"/><text x="80" y="61" font-size="12.5" fill="#1a1a1a" text-anchor="middle">Tokenize</text><rect x="150" y="40" width="120" height="34" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1.25"/><text x="210" y="61" font-size="12.5" fill="#1a1a1a" text-anchor="middle">Embed</text><line x1="210" y1="74" x2="210" y2="96" stroke="#1a1a1a" stroke-width="1.25" marker-end="url(#arw)"/><text x="20" y="116" font-size="10.5" font-weight="600" fill="#5a5a5a" text-anchor="start" letter-spacing="1.3">PREFILL · COMPUTE-BOUND</text><rect x="70" y="124" width="360" height="52" rx="2" fill="#262626" stroke="#1a1a1a" stroke-width="1.5"/><text x="88" y="147" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">Read whole prompt in parallel</text><text x="88" y="165" font-size="10.5" fill="#cfcfcf" text-anchor="start">one heavy forward pass — all tokens attend at once</text><rect x="470" y="120" width="150" height="110" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="545" y="142" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">KV CACHE</text><text x="545" y="162" font-size="10.5" fill="#5a5a5a" text-anchor="middle">keys + values</text><text x="545" y="177" font-size="10.5" fill="#5a5a5a" text-anchor="middle">for every token</text><text x="545" y="197" font-size="10.5" fill="#5a5a5a" text-anchor="middle">written by prefill</text><text x="545" y="212" font-size="10.5" fill="#5a5a5a" text-anchor="middle">read every step</text><line x1="430" y1="150" x2="470" y2="150" stroke="#1a1a1a" stroke-width="1.25" marker-end="url(#arw)"/><text x="450" y="143" font-size="9" fill="#5a5a5a" text-anchor="middle" letter-spacing="1">WRITE</text><line x1="300" y1="176" x2="300" y2="214" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/><text x="308" y="200" font-size="10" fill="#1a1a1a" text-anchor="start" letter-spacing="0.6">← TIME TO FIRST TOKEN</text><text x="20" y="250" font-size="10.5" font-weight="600" fill="#5a5a5a" text-anchor="start" letter-spacing="1.3">DECODE · MEMORY-BANDWIDTH-BOUND</text><rect x="70" y="258" width="360" height="52" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.25"/><text x="88" y="281" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="start">Emit one token, then loop</text><text x="88" y="299" font-size="10.5" fill="#5a5a5a" text-anchor="start">each step reads the cache, appends one new entry</text><line x1="470" y1="284" x2="430" y2="284" stroke="#1a1a1a" stroke-width="1.25" marker-end="url(#arw)"/><text x="450" y="277" font-size="9" fill="#5a5a5a" text-anchor="middle" letter-spacing="1">READ</text><path d="M250 310 v16 h-140 v-16" fill="none" stroke="#1a1a1a" stroke-width="1.25" marker-end="url(#arw)"/><text x="180" y="337" font-size="9.5" fill="#8a8a8a" text-anchor="middle" letter-spacing="1">REPEAT UNTIL DONE</text></svg>