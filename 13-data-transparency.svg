<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 255" font-family="Arial, 'Helvetica Neue', sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#1a1a1a"/></marker><marker id="arwl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#5a5a5a"/></marker><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9e9e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b0b0b0" stroke-width="2"/></pattern></defs><text x="20" y="24" font-size="10.5" font-weight="600" fill="#5a5a5a" text-anchor="start" letter-spacing="1.3">PRESSURE-TEST — 'THE PRETRAINING CORPUS IS OPEN'</text><rect x="40" y="70" width="204.59999999999997" height="56" rx="2" fill="#262626" stroke="#1a1a1a" stroke-width="1.25"/><rect x="244.59999999999997" y="70" width="415.40000000000003" height="56" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="1.25"/><text x="142.29999999999998" y="103.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">~6.6T released</text><text x="452.29999999999995" y="103.0" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">~13.4T proprietary</text><text x="40" y="60" font-size="10" fill="#5a5a5a" text-anchor="start">0</text><text x="660" y="60" font-size="10.5" fill="#5a5a5a" text-anchor="end">~20T tokens trained on</text><text x="40" y="170" font-size="12" fill="#1a1a1a" text-anchor="start">NVIDIA calls this 'the majority of the data' — but it is about a third of tokens, and a mix</text><text x="40" y="190" font-size="12" fill="#1a1a1a" text-anchor="start">of curated web (Nemotron-CC), code and synthetic data — not a purely synthetic corpus.</text><rect x="40" y="208" width="360" height="34" rx="2" fill="#e6e6e3" stroke="#1a1a1a" stroke-width="1"/><text x="58" y="230" font-size="12" fill="#1a1a1a" text-anchor="start">The defensible line:  say </text><text x="208" y="230" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">most, never all.</text></svg>