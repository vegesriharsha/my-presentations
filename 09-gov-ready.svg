<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="Arial, 'Helvetica Neue', sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#1a1a1a"/></marker><marker id="arwl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#5a5a5a"/></marker><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9e9e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b0b0b0" stroke-width="2"/></pattern></defs><text x="20" y="24" font-size="10.5" font-weight="600" fill="#5a5a5a" text-anchor="start" letter-spacing="1.3">THE 'GOVERNMENT-READY' POSTURE — STATED PRECISELY</text><rect x="40" y="44" width="380" height="52" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1.25"/><text x="56" y="68" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="start">Nemotron NIM  (the model)</text><text x="56" y="86" font-size="10.8" fill="#5a5a5a" text-anchor="start">runs on top</text><rect x="40" y="102" width="380" height="52" rx="2" fill="#e6e6e3" stroke="#1a1a1a" stroke-width="1.25"/><text x="56" y="126" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="start">FIPS 140-3 validated crypto libraries</text><text x="56" y="144" font-size="10.8" fill="#5a5a5a" text-anchor="start">approved cryptographic modules</text><rect x="40" y="160" width="380" height="52" rx="2" fill="#262626" stroke="#1a1a1a" stroke-width="1.25"/><text x="56" y="184" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">STIG-hardened Ubuntu base</text><text x="56" y="202" font-size="10.8" fill="#cfcfcf" text-anchor="start">U.S. DoD configuration-hardening standard</text><rect x="446" y="60" width="250" height="130" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.25"/><text x="462" y="84" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="start" letter-spacing="1">SAY IT PRECISELY</text><text x="462" y="106" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="start">Hardening ≠ certification.</text><text x="462" y="126" font-size="10.3" fill="#5a5a5a" text-anchor="start">STIG + FIPS is container / crypto</text><text x="462" y="141" font-size="10.3" fill="#5a5a5a" text-anchor="start">hardening — not a NIST AI RMF</text><text x="462" y="156" font-size="10.3" fill="#5a5a5a" text-anchor="start">certification, and 'FedRAMP-High</text><text x="462" y="171" font-size="10.3" fill="#5a5a5a" text-anchor="start">use cases' ≠ a FedRAMP authority.</text><text x="462" y="186" font-size="10.3" fill="#5a5a5a" text-anchor="start">The AI RMF is OUR process.</text></svg>