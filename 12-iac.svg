<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" font-family="Arial, 'Helvetica Neue', sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#1a1a1a"/></marker><marker id="arwl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#5a5a5a"/></marker><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9e9e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b0b0b0" stroke-width="2"/></pattern></defs><text x="20" y="24" font-size="10.5" font-weight="600" fill="#5a5a5a" text-anchor="start" letter-spacing="1.3">INFRASTRUCTURE AS CODE — THREE LAYERS, ONE PIPELINE</text><rect x="30" y="46" width="150" height="54" rx="2" fill="#262626" stroke="#1a1a1a" stroke-width="1.25"/><text x="105" y="70" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Terraform</text><text x="105" y="88" font-size="10.3" fill="#cfcfcf" text-anchor="middle">Infrastructure</text><text x="200" y="78.0" font-size="12" fill="#1a1a1a" text-anchor="start">declares what exists — reconciled to desired state</text><rect x="30" y="108" width="150" height="54" rx="2" fill="#e6e6e3" stroke="#1a1a1a" stroke-width="1.25"/><text x="105" y="132" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ansible</text><text x="105" y="150" font-size="10.3" fill="#5a5a5a" text-anchor="middle">Configuration</text><text x="200" y="140.0" font-size="12" fill="#1a1a1a" text-anchor="start">brings hosts to a known-good state, repeatably</text><rect x="30" y="170" width="150" height="54" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1.25"/><text x="105" y="194" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Helm</text><text x="105" y="212" font-size="10.3" fill="#5a5a5a" text-anchor="middle">Cluster applications</text><text x="200" y="202.0" font-size="12" fill="#1a1a1a" text-anchor="start">packages &amp; versions what runs on OpenShift</text><rect x="30" y="238" width="640" height="34" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.25"/><text x="50" y="260" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="start">All three live in version control  →  auditable · repeatable · reviewable — no snowflake servers.</text></svg>