<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" font-family="Arial, 'Helvetica Neue', sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#1a1a1a"/></marker><marker id="arwl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#5a5a5a"/></marker><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9e9e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b0b0b0" stroke-width="2"/></pattern></defs><text x="20" y="24" font-size="10.5" font-weight="600" fill="#5a5a5a" text-anchor="start" letter-spacing="1.3">WHAT IS PACKAGED IN A NIM CONTAINER</text><rect x="40" y="40" width="540" height="250" rx="2" fill="#fbfbfa" stroke="#1a1a1a" stroke-width="1.5"/><text x="56" y="64" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start" letter-spacing="1">NIM CONTAINER</text><text x="564" y="64" font-size="10.5" fill="#5a5a5a" text-anchor="end">signed · SBOM · hardened base</text><rect x="56" y="80" width="508" height="38" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1"/><text x="68" y="97" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">OpenAI-compatible API server</text><text x="68" y="111" font-size="10.5" fill="#5a5a5a" text-anchor="start">every app talks one standard interface</text><rect x="56" y="122" width="508" height="38" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1"/><text x="68" y="139" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">Orchestration  (nim-llm)</text><text x="68" y="153" font-size="10.5" fill="#5a5a5a" text-anchor="start">startup, configuration, LoRA adapters</text><rect x="56" y="164" width="508" height="38" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1"/><text x="68" y="181" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">Model management  (nimlib)</text><text x="68" y="195" font-size="10.5" fill="#5a5a5a" text-anchor="start">hardware-aware profile select · weight fetch</text><rect x="56" y="206" width="508" height="38" rx="2" fill="#262626" stroke="#1a1a1a" stroke-width="1"/><text x="68" y="223" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Inference engine  (vLLM, optimized)</text><text x="68" y="237" font-size="10.5" fill="#cfcfcf" text-anchor="start">runs the math on the GPU</text><rect x="56" y="248" width="508" height="38" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1"/><text x="68" y="265" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">Hardened base image</text><text x="68" y="279" font-size="10.5" fill="#5a5a5a" text-anchor="start">least-privilege OS layer</text><rect x="610" y="190" width="180" height="66" rx="2" fill="#e6e6e3" stroke="#1a1a1a" stroke-width="1"/><text x="624" y="214" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="start">Model weights</text><text x="624" y="232" font-size="10.5" fill="#5a5a5a" text-anchor="start">pulled at first start</text><text x="624" y="246" font-size="10.5" fill="#5a5a5a" text-anchor="start">from internal registry</text><line x1="608" y1="223" x2="582" y2="223" stroke="#5a5a5a" stroke-width="1.25" marker-end="url(#arw)"/><text x="610" y="180" font-size="10" fill="#8a8a8a" text-anchor="start">container ≠ model — two governed artifacts</text></svg>