<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Arial, 'Helvetica Neue', sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#1a1a1a"/></marker><marker id="arwl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8 z" fill="#5a5a5a"/></marker><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9e9e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b0b0b0" stroke-width="2"/></pattern></defs><text x="20" y="24" font-size="10.5" font-weight="600" fill="#5a5a5a" text-anchor="start" letter-spacing="1.3">READING THE SCAN — FOUR ARTIFACTS, ONE DECISION</text><rect x="30" y="46" width="168" height="76" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1.25"/><text x="114.0" y="76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">SBOM</text><text x="114.0" y="98" font-size="10.3" fill="#5a5a5a" text-anchor="middle">what is inside the container</text><rect x="212" y="46" width="168" height="76" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1.25"/><text x="296.0" y="76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Scan</text><text x="296.0" y="98" font-size="10.3" fill="#5a5a5a" text-anchor="middle">which known CVEs match</text><rect x="394" y="46" width="168" height="76" rx="2" fill="#262626" stroke="#1a1a1a" stroke-width="1.25"/><text x="478.0" y="76" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">VEX</text><text x="478.0" y="98" font-size="10.3" fill="#cfcfcf" text-anchor="middle">which CVEs are actually exploitable</text><rect x="576" y="46" width="168" height="76" rx="2" fill="#f4f4f2" stroke="#1a1a1a" stroke-width="1.25"/><text x="660.0" y="76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Signature</text><text x="660.0" y="98" font-size="10.3" fill="#5a5a5a" text-anchor="middle">is the image untampered</text><rect x="30" y="156" width="714" height="44" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="387.0" y="183" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">ADMISSION DECISION — risk, not raw count</text><line x1="114.0" y1="122" x2="114.0" y2="156" stroke="#5a5a5a" stroke-width="1.1" marker-end="url(#arw)"/><line x1="296.0" y1="122" x2="296.0" y2="156" stroke="#5a5a5a" stroke-width="1.1" marker-end="url(#arw)"/><line x1="478.0" y1="122" x2="478.0" y2="156" stroke="#5a5a5a" stroke-width="1.1" marker-end="url(#arw)"/><line x1="660.0" y1="122" x2="660.0" y2="156" stroke="#5a5a5a" stroke-width="1.1" marker-end="url(#arw)"/><text x="30" y="226" font-size="11.5" fill="#5a5a5a" text-anchor="start" font-style="italic">A scan gives a number. SBOM says what's in the box; VEX says which findings can actually hurt you.</text></svg>